# Forgejo Actions CI — runs on Codeberg for intercom-service

name: Test

on:
  push:
    branches: [main, opendesk]
  pull_request:
    branches: [main, opendesk]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intercom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: intercom/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
